name: Linux CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    # Pinned like release.yml: ubuntu-latest moves to Ubuntu 26.04 on
    # 2026-10-19 and the apt package names below may change with it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo test --locked
      - run: cargo build --locked
