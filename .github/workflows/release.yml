name: Release

# Pushing a tag like v0.2.0 builds the prebuilt binaries (Linux x86_64, macOS
# arm64 and x86_64) and publishes them with SHA256SUMS as a GitHub release.
# Running it by hand (workflow_dispatch) is a dry run: it builds and uploads
# the same files as workflow artifacts but publishes nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned instead of ubuntu-latest: the latest image moves to Ubuntu 26
          # on 2026-10-19 and the apt package names below may change with it.
          # Built on 22.04 on purpose: the binary links against the build
          # image's glibc (2.35 here), so it also runs on Debian 12 (2.36).
          # On 24.04 (2.39) it installed fine on Debian 12 and failed to start.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # macOS (libproc + lsof backend). Both built on the Apple Silicon
          # runner; the Intel one is a cross build, so it is compiled but
          # not run here.
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      # Oldest macOS the binaries promise to start on (Big Sur); ignored on
      # Linux.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release name
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
            if [ "$tag" != "v$crate_version" ]; then
              echo "::error::Tag $tag does not match Cargo.toml version $crate_version (expected v$crate_version)."
              exit 1
            fi
          else
            tag="dryrun-${GITHUB_SHA::7}"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.target }}

      # No build cache: a release binary is always built from a clean tree.

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="vt-lens-${RELEASE_TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/vt-lens" "dist/$name/"
          files="README.md LICENSE CHANGELOG.md"
          # The desktop launcher is for Linux menus only.
          case "$TARGET" in *-linux-*) files="$files vt-lens.desktop" ;; esac
          for f in $files; do
            if [ -f "$f" ]; then cp "$f" "dist/$name/"; fi
          done
          file "dist/$name/vt-lens"
          # COPYFILE_DISABLE: no AppleDouble (._*) entries from macOS tar.
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: checksums
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
